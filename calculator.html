<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Age Calculator Pro - By Shuvo</title>
  
  <!-- Libraries for Confetti, Screenshot & Toastify -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />

  <style>
    /* Professional Theme Variables */
    :root {
      --bg-color: #e2e8f0;
      --card-bg: #ffffff;
      --text-main: #000000;
      --text-muted: #64748b;
      --text-label: #334155;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: rgba(37, 99, 235, 0.1);
      --border-color: #cbd5e1;
      --input-bg: #f8fafc;
      --success: #10b981;
      --danger: #ef4444;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg-color: #020617;
      --card-bg: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-label: #cbd5e1;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-light: rgba(59, 130, 246, 0.15);
      --border-color: #334155;
      --input-bg: #1e293b;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; transition: background-color 0.3s, color 0.3s, border-color 0.2s; }

    body { background: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

    .calculator-card {
      background: var(--card-bg); width: 100%; max-width: 440px; padding: 30px;
      border-radius: 20px; box-shadow: var(--shadow-lg); position: relative;
    }

    /* Header & Settings */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .header h1 { font-size: 22px; font-weight: 800; color: var(--text-main); }
    
    .settings-btn { background: transparent; border: none; color: var(--text-main); cursor: pointer; padding: 8px; border-radius: 50%; }
    .settings-btn:hover { background: var(--border-color); }
    .settings-btn svg { width: 22px; height: 22px; fill: currentColor; }

    .settings-dropdown {
      position: absolute; top: 70px; right: 30px; background: var(--card-bg); border: 2px solid var(--border-color);
      box-shadow: var(--shadow-lg); border-radius: 12px; padding: 15px; width: 200px; display: none; z-index: 10;
    }
    .settings-dropdown.active { display: block; animation: popIn 0.2s ease-out; }
    .setting-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 14px; font-weight: 700; color: var(--text-main);}
    .setting-item:last-child { margin-bottom: 0; }
    
    /* Toggle */
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border-color); border-radius: 34px; transition: .4s; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .4s; }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(20px); }

    /* Inputs */
    .input-group { margin-bottom: 18px; text-align: left; }
    .input-group label { display: block; font-size: 14px; color: var(--text-label); margin-bottom: 8px; font-weight: 700; }
    input[type="text"], input[type="date"] {
      width: 100%; padding: 14px; border: 2px solid var(--border-color); background: var(--input-bg);
      color: var(--text-main); border-radius: 10px; font-size: 15px; outline: none; font-weight: 600;
    }
    input:focus { border-color: var(--primary); }

    /* Buttons */
    .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 15px;
      font-weight: 800; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary { background: var(--primary); color: #ffffff; flex: 2; }
    .btn-primary:hover { background: var(--primary-hover); transform: scale(0.98); }
    .btn-secondary { background: var(--input-bg); border: 2px solid var(--border-color); color: var(--text-main); flex: 1; }
    .btn-secondary:hover { border-color: var(--primary); color: var(--primary); transform: scale(0.98); }

    /* Result Section */
    .result-container { 
      display: none; margin-top: 25px; padding-top: 25px; border-top: 2px dashed var(--border-color);
    }
    .result-container.show { display: block; animation: fadeIn 0.5s ease forwards; }
    
    .user-greeting { 
      text-align: center; font-size: 24px; font-weight: 900; margin-bottom: 20px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: none;
    }
    
    /* Modern Age Dashboard */
    .age-boxes { display: flex; gap: 10px; margin-bottom: 20px; }
    .age-box { 
      flex: 1; background: var(--primary-light); border: 1px solid rgba(59, 130, 246, 0.2); 
      padding: 20px 5px; border-radius: 12px; text-align: center; 
    }
    .age-box .num { display: block; font-size: 34px; font-weight: 900; color: var(--primary); line-height: 1; margin-bottom: 6px; }
    .age-box .text { font-size: 13px; font-weight: 700; color: var(--text-main); text-transform: uppercase; letter-spacing: 1px; }

    /* Next Birthday Card (Premium Gradient) */
    .next-bday-card { 
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 14px; padding: 20px; text-align: center; margin-bottom: 15px;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25); color: #ffffff;
    }
    .next-bday-card .title { font-size: 13px; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; opacity: 0.9; }
    .next-bday-card .emoji { font-size: 32px; margin-bottom: 5px; }
    .next-bday-card .value { font-size: 20px; font-weight: 900; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }

    .total-days { 
      text-align: center; font-size: 15px; font-weight: 700; color: var(--text-main); 
      display: none; margin-bottom: 20px; background: var(--input-bg); padding: 14px; 
      border-radius: 10px; border: 1px solid var(--border-color);
    }
    .total-days span { color: var(--primary); font-size: 18px; font-weight: 900; margin: 0 4px;}

    /* Saved Profiles */
    .saved-profiles { margin-top: 25px; border-top: 2px dashed var(--border-color); padding-top: 20px; }
    .saved-profiles h3 { font-size: 15px; font-weight: 800; color: var(--text-main); margin-bottom: 15px; }
    .profile-list { display: flex; gap: 10px; flex-wrap: wrap; }
    .profile-chip {
      background: var(--input-bg); border: 1px solid var(--border-color); padding: 6px 14px;
      border-radius: 20px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; 
      align-items: center; gap: 10px; color: var(--text-main); transition: 0.2s;
    }
    .profile-chip:hover { border-color: var(--primary); color: var(--primary); }
    .delete-chip { color: var(--text-muted); font-size: 18px; line-height: 1; padding: 2px; border-radius: 50%; }
    .delete-chip:hover { color: var(--danger); }
    
    /* Footer */
    .footer { margin-top: 25px; text-align: center; font-size: 14px; color: var(--text-muted); font-weight: 600; }
    .footer span { color: var(--primary); font-weight: 800; }

    @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="calculator-card" id="captureArea">
    
    <!-- Header -->
    <div class="header">
      <h1>Age Calculator</h1>
      <button class="settings-btn" id="settingsBtn" onclick="toggleSettings()" title="Settings">
        <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
      </button>

      <div class="settings-dropdown" id="settingsMenu">
        <div class="setting-item">
          <span>Dark Mode</span>
          <label class="switch"><input type="checkbox" id="themeToggle" onchange="toggleTheme()"><span class="slider"></span></label>
        </div>
        <div class="setting-item">
          <span>Show Total Days</span>
          <label class="switch"><input type="checkbox" id="detailsToggle" onchange="toggleDetails()"><span class="slider"></span></label>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-group">
      <label>Name (Optional)</label>
      <input type="text" id="personName" placeholder="e.g., Developer Shuvo" autocomplete="off">
    </div>
    <div class="input-group">
      <label>Date of Birth</label>
      <input type="date" id="birthDate">
    </div>

    <div class="btn-group" id="actionButtons">
      <button onclick="calculateAge()" class="btn btn-primary">🪄 Calculate Age</button>
      <button onclick="saveProfile()" class="btn btn-secondary" id="saveBtn">💾 Save</button>
    </div>

    <!-- Result Area -->
    <div class="result-container" id="resultContainer">
      <div class="user-greeting" id="greetingName"></div>
      
      <div class="age-boxes">
        <div class="age-box"><span class="num" id="r-years">0</span><span class="text">Years</span></div>
        <div class="age-box"><span class="num" id="r-months">0</span><span class="text">Months</span></div>
        <div class="age-box"><span class="num" id="r-days">0</span><span class="text">Days</span></div>
      </div>

      <div class="next-bday-card">
        <div class="title">Next Birthday In</div>
        <div class="emoji">🎂</div>
        <div class="value" id="next-bday">0 Months, 0 Days</div>
      </div>

      <div class="total-days" id="extraDetails">
        Total Days Lived: <span id="r-total-days">0</span> days
      </div>

      <button onclick="downloadCard()" class="btn" id="downloadBtn" style="background: var(--text-main); color: var(--bg-color);">
        📸 Download Card
      </button>
    </div>

    <!-- Saved Profiles List -->
    <div class="saved-profiles" id="savedSection" style="display: none;">
      <h3>Saved Profiles</h3>
      <div class="profile-list" id="profileList"></div>
    </div>

    <!-- Footer -->
    <div class="footer">Developed by <span>Developer Shuvo</span></div>
  </div>

  <script>
    // Theme & Initial Setup
    document.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      if(savedTheme === 'dark') document.getElementById('themeToggle').checked = true;
      loadProfiles();
    });

    function toggleSettings() { document.getElementById('settingsMenu').classList.toggle('active'); }
    
    document.addEventListener('click', function(event) {
      const menu = document.getElementById('settingsMenu');
      const btn = document.getElementById('settingsBtn');
      if (!menu.contains(event.target) && !btn.contains(event.target)) {
        menu.classList.remove('active');
      }
    });

    function toggleTheme() {
      const isDark = document.getElementById('themeToggle').checked;
      const newTheme = isDark ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    }
    
    function toggleDetails() {
      const isChecked = document.getElementById('detailsToggle').checked;
      document.getElementById('extraDetails').style.display = isChecked ? 'block' : 'none';
    }

    // Toast Notification
    function showToast(message, color) {
      Toastify({
        text: message, duration: 3000, gravity: "top", position: "center",
        style: { background: color, borderRadius: "8px", fontWeight: "bold" }
      }).showToast();
    }

    // Core Calculation Logic
    function calculateAge() {
      const nameVal = document.getElementById('personName').value.trim();
      const birthDateVal = document.getElementById('birthDate').value;
      
      if (!birthDateVal) { showToast('Please select a birth date!', '#ef4444'); return; }

      const birth = new Date(birthDateVal);
      const today = new Date();
      if (birth > today) { showToast('Birth date cannot be in the future!', '#ef4444'); return; }

      let years = today.getFullYear() - birth.getFullYear();
      let months = today.getMonth() - birth.getMonth();
      let days = today.getDate() - birth.getDate();

      if (days < 0) {
        months--;
        days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
      }
      if (months < 0) {
        years--;
        months += 12;
      }

      // Update UI
      document.getElementById('r-years').innerText = years;
      document.getElementById('r-months').innerText = months;
      document.getElementById('r-days').innerText = days;
      
      const greeting = document.getElementById('greetingName');
      if(nameVal) {
        greeting.innerText = `Hello, ${nameVal}!`;
        greeting.style.display = 'block';
      } else {
        greeting.style.display = 'none';
      }

      const totalDays = Math.floor(Math.abs(today - birth) / (1000 * 60 * 60 * 24));
      document.getElementById('r-total-days').innerText = totalDays.toLocaleString();

      calculateNextBirthday(birth, today);

      if (birth.getDate() === today.getDate() && birth.getMonth() === today.getMonth()) {
        fireConfetti();
        showToast('Happy Birthday! 🎉', '#10b981');
      } else {
        showToast('Age Calculated!', '#2563eb');
      }

      document.getElementById('resultContainer').classList.add('show');
    }

    function calculateNextBirthday(birthDate, today) {
      let nextBday = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
      if (today > nextBday && (today.getDate() !== nextBday.getDate() || today.getMonth() !== nextBday.getMonth())) {
        nextBday.setFullYear(today.getFullYear() + 1);
      }
      
      let diffTime = nextBday - today;
      let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      
      let m = Math.floor(diffDays / 30.44);
      let d = Math.floor(diffDays % 30.44);
      
      if (diffDays === 0) {
        document.getElementById('next-bday').innerText = "Today is your Birthday! 🎉";
      } else {
        document.getElementById('next-bday').innerText = `${m} Months, ${d} Days`;
      }
    }

    function fireConfetti() {
      var duration = 3 * 1000;
      var animationEnd = Date.now() + duration;
      var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };
      var interval = setInterval(function() {
        var timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);
        var particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: Math.random(), y: Math.random() - 0.2 } }));
      }, 250);
    }

    // Profile Management
    function saveProfile() {
      const name = document.getElementById('personName').value.trim();
      const date = document.getElementById('birthDate').value;
      if(!name || !date) { showToast("Please enter Name and Date to save!", '#ef4444'); return; }

      let profiles = JSON.parse(localStorage.getItem('age_profiles_shuvo')) || [];
      // Prevent duplicates
      if (profiles.some(p => p.name === name && p.date === date)) {
        showToast("Profile already exists!", '#f59e0b');
        return;
      }
      
      profiles.push({ name, date });
      localStorage.setItem('age_profiles_shuvo', JSON.stringify(profiles));
      loadProfiles();
      
      showToast("Profile Saved!", '#10b981');
      document.getElementById('personName').value = '';
    }

    function loadProfiles() {
      let profiles = JSON.parse(localStorage.getItem('age_profiles_shuvo')) || [];
      const section = document.getElementById('savedSection');
      const list = document.getElementById('profileList');
      list.innerHTML = '';

      if (profiles.length > 0) {
        section.style.display = 'block';
        profiles.forEach((p, index) => {
          let chip = document.createElement('div');
          chip.className = 'profile-chip';
          chip.innerHTML = `<span onclick="fillProfile('${p.name}', '${p.date}')">${p.name}</span> 
                            <span class="delete-chip" onclick="deleteProfile(${index})" title="Delete">&times;</span>`;
          list.appendChild(chip);
        });
      } else {
        section.style.display = 'none';
      }
    }

    function fillProfile(name, date) {
      document.getElementById('personName').value = name;
      document.getElementById('birthDate').value = date;
      calculateAge();
    }

    function deleteProfile(index) {
      let profiles = JSON.parse(localStorage.getItem('age_profiles_shuvo')) || [];
      profiles.splice(index, 1);
      localStorage.setItem('age_profiles_shuvo', JSON.stringify(profiles));
      loadProfiles();
      showToast("Profile Deleted!", '#ef4444');
    }

    // Screenshot Logic
    function downloadCard() {
      const card = document.getElementById('captureArea');
      
      // Elements to hide before taking screenshot
      const elementsToHide = [
        document.getElementById('downloadBtn'),
        document.getElementById('settingsBtn'),
        document.getElementById('savedSection'),
        document.getElementById('actionButtons')
      ];

      elementsToHide.forEach(el => { if (el) el.style.display = 'none'; });

      const userName = document.getElementById('personName').value.trim();
      let fileName = userName ? `Age_Card_${userName.replace(/\s+/g, '_')}.png` : 'Age_Card_Shuvo.png';

      html2canvas(card, { 
        backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim(),
        scale: 2 // High Quality
      }).then(canvas => {
        let link = document.createElement('a');
        link.download = fileName;
        link.href = canvas.toDataURL("image/png");
        link.click();
        
        // Restore elements
        document.getElementById('downloadBtn').style.display = 'block';
        document.getElementById('settingsBtn').style.display = 'block';
        document.getElementById('actionButtons').style.display = 'flex';
        loadProfiles();
        
        showToast("Card Downloaded!", '#10b981');
      });
    }
  </script>
</body>
</html>
